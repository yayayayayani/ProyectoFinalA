# Incluido desde C:/xampp/apache/conf/extra/httpd-vhosts.conf.
# Conserva el puerto de origen utilizado por Cloudflare.
Listen 127.0.0.1:8000
<VirtualHost 127.0.0.1:8000>
    ServerName lacantera.lol
    ServerAlias localhost 127.0.0.1
    DocumentRoot "C:/Users/dayli/ProyectoFinalA/public"
    DirectoryIndex index.php

    <Directory "C:/Users/dayli/ProyectoFinalA/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <Directory "C:/Users/dayli/ProyectoFinalA/public/assets">
        FallbackResource disabled
    </Directory>

    # Los alias administrativos de XAMPP no deben atravesar el túnel.
    <LocationMatch "(?i)^/(phpmyadmin|php-cgi|webalizer|licenses|dashboard|xampp)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog "logs/cantera-error.log"
    CustomLog "logs/cantera-access.log" combined
</VirtualHost>
