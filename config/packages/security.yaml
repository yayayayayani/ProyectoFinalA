security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        administradores:
            entity:
                class: App\Entity\Administrador
                property: usuario
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: administradores
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_inicio
            logout:
                path: app_logout
                target: app_inicio
                enable_csrf: true
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: '^/(equipo|jugador|jornada|gol|incidencia)(/|$)', roles: ROLE_ADMIN, methods: [POST, PUT, PATCH, DELETE] }
        - { path: '^/(equipo|jugador|jornada|gol|incidencia)/(new|[0-9]+/(edit|delete))$', roles: ROLE_ADMIN }
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
